<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Evolve is a simple habit tracker with a monthly grid, progress charts and target streaks." />
  <title>Evolve</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300ffc8'/%3E%3Cstop offset='1' stop-color='%23b4ff00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='900' text-anchor='middle' fill='url(%23g)'%3EE%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Apply the saved theme before the page is drawn, so there is no flash of the wrong theme -->
  <script>
    try {
      var savedTheme = localStorage.getItem('evolve.theme');
      if (savedTheme && /^[a-z-]+$/.test(savedTheme)) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) { /* storage blocked: the Default theme is used */ }
  </script>
</head>
<body>
  <main>
    <!-- Theme picker -->
    <div class="theme-bar">
      <span id="themeLabel">Theme</span>
      <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-labelledby="themeLabel"></div>
    </div>

    <!-- Title Card -->
    <header class="card title-card">
      <h1>EVOLVE</h1>
      <p>Track Your Journey to a Better Self</p>
    </header>

    <!-- Month grid: one row per habit, one checkbox per day -->
    <section class="card">
      <div class="card-head">
        <div class="month-nav">
          <button class="rename-btn" id="prevBtn" title="Previous month">Prev</button>
          <h2 id="monthLabel"></h2>
          <button class="rename-btn" id="nextBtn" title="Next month">Next</button>
        </div>
        <div class="head-actions">
          <button class="rename-btn" id="renameBtn" title="Rename habit">Rename</button>
          <button class="rename-btn" id="deleteBtn" title="Delete habit">Delete</button>
          <form id="addForm">
            <input id="habitInput" placeholder="New habit…" maxlength="30" aria-label="New habit name" required />
            <button class="add" title="Add habit" aria-label="Add habit">Add</button>
          </form>
        </div>
      </div>
      <div class="scroll"><table id="grid"></table></div>
    </section>

    <!-- Graphs -->
    <section class="charts">
      <div class="card wide">
        <h2>Weekly Progress</h2>
        <div id="legend" class="legend"></div>
        <div id="weekly" class="chart"></div>
      </div>
      <div class="card">
        <h2>Monthly Progress</h2>
        <div id="monthly" class="chart"></div>
      </div>
      <div class="card">
        <h2>Consistency</h2>
        <div id="consistency" class="chart"></div>
      </div>
      <div class="card">
        <h2>Your Target Streak</h2>
        <div class="target-controls">
          <label for="targetInput">Set Target (days):</label>
          <input type="number" id="targetInput" min="1" max="365" value="21" />
          <button id="targetGoBtn" class="go-btn">Go</button>
        </div>
        <div id="targetStreak" class="chart"></div>
      </div>
    </section>

    <!-- Daily To-Do List -->
    <section class="card todo-card">
      <h2>Daily To-Do List</h2>
      <div class="todo-nav">
        <button class="rename-btn" id="todoPrevBtn" title="Previous day">Prev</button>
        <span id="todoDateLabel" class="todo-date"></span>
        <button class="rename-btn" id="todoNextBtn" title="Next day">Next</button>
      </div>
      <form id="todoForm" class="todo-form">
        <input id="todoInput" placeholder="Add a task…" maxlength="50" aria-label="New task" required />
        <button class="add" title="Add task" aria-label="Add task">Add</button>
      </form>
      <ul id="todoList" class="todo-list"></ul>
      <div id="todoProgress" class="todo-progress"></div>
    </section>

    <!-- GitHub follow button -->
    <footer class="footer">
      <a href="https://github.com/AnkitPareek-7" target="_blank" rel="noopener" class="github-btn">
        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Follow <strong>AnkitPareek</strong> on GitHub
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
